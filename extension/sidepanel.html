<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FilmBuddy</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <!--
    SIDEPANEL.HTML
    ==============
    This is the main UI structure for the FilmBuddy sidebar.

    Sections:
    1. Header - Film selection and settings
    2. Chat Messages - Conversation history
    3. Input Area - Question input and controls
  -->

  <div class="container">

    <!-- HEADER: Film selection and connection status -->
    <header class="header">
      <h1 class="title">FilmBuddy</h1>

      <div class="film-selector">
        <label for="film-select">Watching:</label>
        <select id="film-select">
          <option value="la_la_land">La La Land</option>
          <!-- More films will be added here -->
        </select>
      </div>

      <div class="controls">
        <div class="timestamp-display">
          <span id="current-time">0:00</span>
        </div>

        <label class="spoiler-toggle">
          <input type="checkbox" id="spoiler-mode">
          <span class="toggle-label">Spoilers OK</span>
        </label>
      </div>

      <div class="status" id="connection-status">
        <span class="status-dot"></span>
        <span class="status-text">Connecting...</span>
      </div>
    </header>

    <!-- CHAT MESSAGES: Conversation history -->
    <main class="chat-container" id="chat-container">
      <div class="welcome-message">
        <p>Hi! I'm FilmBuddy, your movie companion.</p>
        <p>Ask me anything about what you're watching - I won't spoil what's ahead!</p>
      </div>
    </main>

    <!-- INPUT AREA: Question input and send button -->
    <footer class="input-area">
      <div class="input-wrapper">
        <textarea
          id="question-input"
          placeholder="Ask about the movie..."
          rows="1"
        ></textarea>
        <button id="send-button" title="Send">
          <svg viewBox="0 0 24 24" width="20" height="20">
            <path fill="currentColor" d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
          </svg>
        </button>
      </div>
      <div class="input-hint">
        Press Enter to send, Shift+Enter for new line
      </div>
    </footer>

  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
